name: Build DonLoader Release

on:
  push:
    tags:
      - 'v*' # Se ejecuta al crear un tag como v1.1.0

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Portable Executable
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller yt-dlp pillow requests

    - name: Set up FFmpeg
      uses: FedericoCarboni/setup-ffmpeg@v3

    - name: Prepare FFmpeg and FFprobe Binaries
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Path "bin" -Force
        $ffmpeg = (Get-Command ffmpeg).Source
        $ffprobe = (Get-Command ffprobe).Source
        Write-Host "Copying FFmpeg from $ffmpeg and FFprobe from $ffprobe to local bin/..."
        Copy-Item $ffmpeg "bin\ffmpeg.exe"
        Copy-Item $ffprobe "bin\ffprobe.exe"
        if (-not (Test-Path "bin/ffmpeg.exe") -or -not (Test-Path "bin/ffprobe.exe")) {
          Write-Error "Failed to copy FFmpeg/FFprobe binaries to bin/ directory!"
          exit 1
        }

    - name: Build Executable with PyInstaller
      shell: pwsh
      run: |
        python -m PyInstaller --clean DonLoader.spec > pyinstaller.log 2>&1
        $exitCode = $LASTEXITCODE
        if ($exitCode -ne 0) {
          Write-Host "--- PYINSTALLER ERROR LOG ---"
          Get-Content pyinstaller.log
          exit $exitCode
        }

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configure Keystore Credentials
      shell: pwsh
      run: |
        echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> android/local.properties
        echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> android/local.properties

    - name: Build Android Release APK
      shell: pwsh
      run: |
        cd android
        ./gradlew assembleRelease

    - name: Create Release and Upload Artifacts
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/DonLoader.exe
          android/app/build/outputs/apk/release/app-release.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
